[workspace]
resolver = "2"
members = ["crates/vectorio-core", "crates/vectorio-app"]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT"

# Las dependencias se compilan optimizadas también en desarrollo: el vectorizado
# y los rellenos son lentos sin optimizar.
[profile.dev]
opt-level = 1
# Evita símbolos de depuración y copias incrementales voluminosas. Las pruebas
# heredan este perfil; la aplicación instalada usa el perfil release.
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

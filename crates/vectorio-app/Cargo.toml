[package]
name = "vectorio-app"
description = "Vectorio · aplicación de escritorio para dibujar con plotter"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vectorio"
path = "src/main.rs"

[dependencies]
vectorio-core = { path = "../vectorio-core" }
# Pintado por GPU con wgpu (Metal en macOS).
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
muda = { version = "0.17", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "3"
sys-locale = "0.3"
tempfile = "3"

# ⌘W oculta la ventana y el Dock la recupera (applicationShouldHandleReopen).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }

[dev-dependencies]
serde_yaml = "0.9"

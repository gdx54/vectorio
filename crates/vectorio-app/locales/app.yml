  en: "Connected%{version} · carriage free"
"Trazar en la máquina":
  en: "Plot on the machine"
"Toma como origen el punto donde esté el carro si los motores están sueltos. Antes de cada tinta, pausa para que la pongas.":
  en: "If the motors are free, wherever the carriage is becomes the origin. Before each ink it pauses so you can load it."

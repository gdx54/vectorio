"Punteado":
  en: "Stippling"
"Contornos limpios y continuos que siguen las formas de la foto, como un dibujo a plumilla.":
  en: "Clean, continuous outlines that follow the shapes in the photo, like a pen-and-ink drawing."
"Miles de puntos bien repartidos: se juntan en las sombras y en los bordes importantes.":
  en: "Thousands of evenly spread dots that gather in the shadows and along important edges."
"Sensibilidad":
  en: "Sensitivity"
"Continuidad":
  en: "Continuity"
"Largo mín.":
  en: "Min. length"
"Sombras":
  en: "Shadows"
"Bordes":
  en: "Edges"
"Reparto":
  en: "Spread"
"Punto":
  en: "Dot"
"Contraste local":
  en: "Local contrast"
"Suavizar sin borrar bordes":
  en: "Smooth, keep edges"
"Valores altos ignoran el detalle fino y dejan solo las formas grandes.":
  en: "Higher values ignore fine detail and keep only the large shapes."
"Valores altos encuentran también los bordes suaves.":
  en: "Higher values also find soft edges."
"Sigue cada borde a lo largo de la forma: une los trazos y alisa su recorrido.":
  en: "Follows each edge along its shape, joining strokes and smoothing their path."
"Descarta los trazos más cortos.":
  en: "Drops the shortest strokes."
"Añade el contorno de las zonas de sombra, en tantos niveles de luz como indiques.":
  en: "Adds the outline of shadow areas, at as many light levels as you choose."
"Junta más puntos en los bordes y el detalle de la foto.":
  en: "Gathers more dots along edges and detail in the photo."
"Pasadas para repartir los puntos: más pasadas, reparto más regular.":
  en: "Passes that spread the dots out: more passes give a more even spread."
"Alisa la piel, el cielo y las texturas finas sin difuminar los contornos.":
  en: "Smooths skin, sky and fine textures without blurring the outlines."
"Separa los tonos parecidos dentro de cada zona de la foto.":
  en: "Separates similar tones within each area of the photo."
"Un solo trazo":
  en: "Single stroke"
"Sombreado cruzado":
  en: "Cross-hatching"
"Buril":
  en: "Burin"
"Línea continua":
  en: "Continuous line"
"Bucles":
  en: "Loops"
"Relieve":
  en: "Relief"
"Ensanche":
  en: "Swell"
"Paradas":
  en: "Stops"
"Capas de rayas en varias direcciones: cuanto más oscura la zona, más capas se cruzan.":
  en: "Layers of lines in several directions: the darker the area, the more layers cross."
"Rayas paralelas que se curvan con el relieve de la foto y se ensanchan en las sombras, como un grabado a buril.":
  en: "Parallel lines that bend with the photo's relief and swell in the shadows, like a burin engraving."
"Un único trazo, sin levantar la punta, que recorre la foto y se apretuja en las sombras.":
  en: "A single stroke that never lifts the pen, travelling across the photo and crowding into the shadows."
"Un trazo de bucles enlazados que se amontonan en las sombras, como un garabato a mano.":
  en: "A stroke of linked loops that pile up in the shadows, like a hand-drawn scribble."
"Cuántas direcciones de rayas se cruzan en las zonas más oscuras.":
  en: "How many line directions cross in the darkest areas."
"Ondula un poco las rayas, como trazadas a mano.":
  en: "Makes the lines waver slightly, as if drawn by hand."
"Cuánto se curvan las rayas siguiendo la luz de la foto.":
  en: "How much the lines bend following the light in the photo."
"Ancho máximo del surco en las sombras.":
  en: "Maximum width of the groove in the shadows."
"Idas y vueltas de la punta donde el surco es más ancho.":
  en: "Back-and-forth passes of the pen where the groove is widest."
"Puntos por los que pasa la línea: más paradas, más detalle y más tinta.":
  en: "Points the line passes through: more stops, more detail and more ink."
"Redondea las esquinas de la línea.":
  en: "Rounds the corners of the line."
"Tamaño de los bucles respecto a la distancia entre paradas.":
  en: "Size of the loops relative to the distance between stops."
"Cuánto cambia el tamaño de los bucles por el camino.":
  en: "How much the loop size changes along the way."
"Añadir otro estilo encima":
  en: "Add another style on top"
"Dibuja otro estilo sobre este con la misma foto: por ejemplo, tinta sobre manchas de color.":
  en: "Draws another style over this one from the same photo: for example, ink over colour patches."
"Ver y añadir al papel este estilo":
  en: "Show this style and add it to the paper"
"Editar este estilo":
  en: "Edit this style"
"Todos los estilos están ocultos":
  en: "All styles are hidden"
"Quitar":
  en: "Remove"
"Dibujar este estilo antes, por debajo":
  en: "Draw this style earlier, underneath"
"Dibujar este estilo después, por encima":
  en: "Draw this style later, on top"
"ORDEN DE LAS TINTAS":
  en: "INK ORDER"
"Seguir el orden del lienzo":
  en: "Follow the canvas order"
"Traza los objetos de abajo arriba, como se ven en Diseño: lo que queda encima se dibuja al final. Útil con tintas opacas, como los rotuladores acrílicos; puede cambiar de tinta más veces.":
  en: "Plots the objects from bottom to top, as they appear in Design: whatever is on top is drawn last. Useful with opaque inks such as acrylic markers; it may change ink more often."
"De abajo arriba, como en el lienzo. Los objetos seguidos con la misma tinta se trazan juntos.":
  en: "Bottom to top, as on the canvas. Consecutive objects with the same ink are plotted together."
"Una tinta tras otra, en el orden de la paleta: los menos cambios posibles.":
  en: "One ink after another, in palette order: as few changes as possible."
"Cambios manuales con esta pausa mínima prevista. Se sigue el orden del lienzo.":
  en: "Manual changes with this minimum expected pause. The canvas order is followed."
"Boceto":
  en: "Sketch"
"Un dibujo a mano que se construye mirando el papel: encaja las masas, modela con rayas que siguen las formas, cruza en las sombras y repasa el detalle. Con una tinta o sanguina y carbón.":
  en: "A hand drawing built by looking at the paper: it blocks in the masses, models with strokes that follow the forms, crosshatches the shadows and goes over the detail. In one ink, or sanguine and charcoal."
"Una":
  en: "One"
"Sanguina y carbón":
  en: "Sanguine and charcoal"
"Finura":
  en: "Fineness"
"Anchos de punta que caben en el lado mayor: más finura, trazos más finos y apretados.":
  en: "Pen widths that fit along the longest side: more fineness gives thinner, tighter strokes."
"Parte de los tonos claros que se queda sin dibujar.":
  en: "Share of the light tones left undrawn."
"Foco":
  en: "Focus"
"El centro de interés se lleva el tono y los bordes se disuelven en el papel.":
  en: "The centre of interest takes the tone and the edges dissolve into the paper."
"Soltura":
  en: "Looseness"
"Trazos en arco y contornos repasados, como una mano suelta.":
  en: "Arcing strokes and restated outlines, like a loose hand."
"Haces":
  en: "Bundles"
"Agrupa las rayas en haces paralelos, como al sombrear a mano.":
  en: "Groups the strokes into parallel bundles, as when shading by hand."
"Líneas de encaje en los bordes; se pierden y reaparecen.":
  en: "Blocking-in lines along the edges; they fade out and come back."
"Cruce":
  en: "Crossing"
"Cuánto se cruzan las rayas en las sombras profundas, como en un aguafuerte.":
  en: "How much the strokes cross in deep shadows, as in an etching."
"Trazos máx.":
  en: "Max. strokes"
"Pinceladas":
  en: "Brushwork"
"Una pintura de toques cortos de color, entre puntos y rayas, que se construye mirando el papel: cada toque elige el rotulador que más acerca el color a la foto, sigue las formas y alterna colores vecinos que se mezclan en el ojo.":
  en: "A painting of short colour touches, between dots and dashes, built by looking at the paper: each touch picks the pen that brings the colour closest to the photo, follows the forms and alternates neighbouring colours that blend in the eye."
"Colores vivos":
  en: "Vivid colours"
"Toque":
  en: "Touch"
"Ancho de cada toque, en anchos de punta.":
  en: "Width of each touch, in pen widths."
"Largo del toque":
  en: "Touch length"
"Valores bajos pintan casi puntos; altos, rayas cortas.":
  en: "Low values paint almost dots; high values, short dashes."
"Viveza":
  en: "Vibrancy"
"Aviva los colores apagados de la foto.":
  en: "Brightens the photo's dull colours."
"Color roto":
  en: "Broken colour"
"Alterna colores vecinos en una misma zona para que se mezclen en el ojo.":
  en: "Alternates neighbouring colours within an area so they blend in the eye."
"Dirección de los toques donde la imagen no tiene una estructura clara.":
  en: "Direction of the touches where the image has no clear structure."
"Toques en arco, como una mano suelta.":
  en: "Arcing touches, like a loose hand."
"Acentos":
  en: "Accents"
"Toques oscuros que marcan los bordes más fuertes.":
  en: "Dark touches that mark the strongest edges."
"Ajustar a la punta y al tamaño":
  en: "Fit to the pen and the size"
"Calcula cuántas curvas caben para que en el negro se junten sin empastarse.":
  en: "Works out how many curves fit so that they close up in the blacks without merging."
"Punta de %{pen} mm en %{long} mm de lado mayor.":
  en: "%{pen} mm pen over a %{long} mm longest side."
"Tinta máx.":
  en: "Max. ink"
"Parte del papel que cubren las curvas en las sombras: por debajo del 100 % no se empastan.":
  en: "Share of the paper the curves cover in the shadows: below 100 % they don't merge."
"Distancia máxima entre curvas en el blanco, en anchos de punta.":
  en: "Largest distance between curves in the whites, in pen widths."
"Esquirla":
  en: "Shard"
"Un fragmento donde las curvas se multiplican y se trazan con una punta más fina.":
  en: "A fragment where the curves multiply and are drawn with a finer pen."
"Más fina":
  en: "Finer"
"Cuántas veces más curvas, y más fina la punta, dentro de la esquirla.":
  en: "How many times more curves, and how much finer the pen, inside the shard."

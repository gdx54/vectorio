  en: "Stop"
"Sube la pluma y deja el carro donde está.":
  en: "Lifts the pen and leaves the carriage where it is."
"En pausa · pluma arriba":
  en: "Paused · pen up"
"Trazando · paso %{i} de %{n}":
  en: "Plotting · step %{i} of %{n}"
"Trazado terminado.":
  en: "Plot finished."
"Siguiendo a la máquina":
  en: "Following the machine"
"Trazado parado. La pluma queda arriba.":
  en: "Plot stopped. The pen stays up."
"Botón de la máquina pulsado: trazado en pausa.":
  en: "Machine button pressed: plot paused."
"No se encuentra la máquina. Comprueba que está encendida y que el cable USB pasa datos, no solo carga.":
  en: "Can't find the machine. Check that it's on and that the USB cable carries data, not just power."
"Se ha perdido la conexión USB con la máquina. Comprueba el cable y vuelve a conectar; antes de trazar, lleva el carro al origen.":
  en: "The USB connection to the machine was lost. Check the cable and connect again; before plotting, bring the carriage back to the origin."
"El dibujo no cabe en el recorrido de la máquina. Revisa el recorrido y la posición del papel.":
  en: "The drawing doesn't fit in the machine's travel. Check the travel and the paper position."
"Revisa los ajustes de la máquina: hay valores fuera de rango.":
  en: "Check the machine settings: some values are out of range."
"La máquina ha respondido algo inesperado: %{respuesta}":
  en: "The machine sent an unexpected reply: %{respuesta}"
"Máquina: pluma, origen y recorrido":
  en: "Machine: pen, origin and travel"
"Fija el boli en el soporte con la pluma abajo, apoyado en el papel sin forzar.":
  en: "Clamp the pen in its holder with the pen down, resting on the paper without pressure."
